plugins {
    id 'com.android.application'
}

android {
    namespace 'com.projectpsyco.game'
    compileSdk 34

    defaultConfig {
        applicationId "com.projectpsyco.game"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "2.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    // Zero heavy dependencies for maximum 60fps performance
}
